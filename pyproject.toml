[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "shorty-code"
version = "0.1.0"
description = "A simple command line utility to shorten source code by removing comments and redundant blank lines."
readme = "README.md"
authors = [{name = "Shorty Maintainers"}]
requires-python = ">=3.9"

[project.scripts]
shorty = "shorty.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
